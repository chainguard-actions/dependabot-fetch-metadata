name: Test skip-verification with no pull_request context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Even with skip-verification: true, the action still requires a pull_request
      # event payload. Under workflow_dispatch, context.payload.pull_request is
      # undefined, so the action should warn and set the job as failed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-verification: true
          skip-commit-verification: true

      - name: Assert action failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no pull_request payload is present, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no pull_request context is present even with skip-verification"
