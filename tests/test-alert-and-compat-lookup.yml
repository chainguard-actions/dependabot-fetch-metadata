name: Test alert-lookup and compat-lookup inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-verification: true
          alert-lookup: true
          compat-lookup: true

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DEP_NAMES: ${{ steps.action.outputs.dependency-names }}
          ALERT_STATE: ${{ steps.action.outputs.alert-state }}
          GHSA_ID: ${{ steps.action.outputs.ghsa-id }}
          CVSS: ${{ steps.action.outputs.cvss }}
          COMPAT_SCORE: ${{ steps.action.outputs.compatibility-score }}
        run: |
          echo "outcome: $OUTCOME"
          echo "dependency-names: $DEP_NAMES"
          echo "alert-state: $ALERT_STATE"
          echo "ghsa-id: $GHSA_ID"
          echo "cvss: $CVSS"
          echo "compatibility-score: $COMPAT_SCORE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DEP_NAMES" ]; then
              echo "FAIL: action succeeded but dependency-names output is empty"
              exit 1
            fi
            echo "PASS: got dependency-names='$DEP_NAMES'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / not a Dependabot PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
