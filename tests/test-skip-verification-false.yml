name: Test - Skip Verification False (Default Behavior)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With skip-verification: false (the default), the action validates the PR
      # is from Dependabot. Under workflow_dispatch there is no pull_request payload,
      # so the action should fail with a warning about the missing pull_request key.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-verification: 'false'
          skip-commit-verification: 'false'

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not triggered by a pull_request event, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when not triggered by a pull_request event with verification enabled"
