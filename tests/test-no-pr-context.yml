name: Test no pull_request context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a pull_request event payload. Under workflow_dispatch,
      # context.payload.pull_request is undefined, so the action should warn and
      # set the job as failed with "PR is not from Dependabot, nothing to do."
      # We use continue-on-error to capture the failure and assert on it.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-verification: false

      - name: Assert action failed with expected message
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when not triggered by a pull_request event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no pull_request context is present"
