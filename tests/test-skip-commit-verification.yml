name: Test skip-commit-verification mode (GHES)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          skip-verification: true
          skip-commit-verification: true

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          DEP_NAMES: ${{ steps.action.outputs.dependency-names }}
          PREV_VERSION: ${{ steps.action.outputs.previous-version }}
          NEW_VERSION: ${{ steps.action.outputs.new-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "dependency-names: $DEP_NAMES"
          echo "previous-version: $PREV_VERSION"
          echo "new-version: $NEW_VERSION"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$DEP_NAMES" ]; then
              echo "FAIL: action succeeded but dependency-names output is empty"
              exit 1
            fi
            echo "PASS: got dependency-names='$DEP_NAMES'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / not a Dependabot PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
