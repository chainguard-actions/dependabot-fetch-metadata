name: Test missing pull_request payload fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock push event payload (no pull_request key)
        run: |
          mkdir -p /tmp/mock-event
          cat > /tmp/mock-event/event.json <<'EOF'
          {
            "ref": "refs/heads/main",
            "repository": {
              "name": "fetch-metadata",
              "owner": { "login": "dependabot" }
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/mock-event/event.json
          GITHUB_EVENT_NAME: push
          GITHUB_REPOSITORY: dependabot/fetch-metadata
        with:
          github-token: "fake-token-for-testing"
          skip-verification: "true"

      - name: Assert action failed due to missing pull_request payload
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when pull_request payload is missing, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when pull_request payload is missing"
