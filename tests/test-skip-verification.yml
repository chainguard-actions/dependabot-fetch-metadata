name: Test skip-verification bypasses author check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock PR event payload with non-Dependabot author
        run: |
          mkdir -p /tmp/mock-event
          # When skip-verification is false, a non-Dependabot author should be rejected
          # without making any API calls (returns false early)
          cat > /tmp/mock-event/event.json <<'EVENTEOF'
          {
            "pull_request": {
              "number": 42,
              "user": { "login": "some-human-user" },
              "head": { "ref": "dependabot/npm_and_yarn/lodash-4.17.21" },
              "base": { "ref": "main" },
              "body": "Manual bump of lodash",
              "title": "Bump lodash from 4.17.20 to 4.17.21"
            },
            "repository": {
              "name": "fetch-metadata",
              "owner": { "login": "dependabot" }
            }
          }
          EVENTEOF

      - id: action-no-skip
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/mock-event/event.json
          GITHUB_EVENT_NAME: pull_request
          GITHUB_REPOSITORY: dependabot/fetch-metadata
        with:
          github-token: ${{ github.token }}
          skip-verification: "false"

      - name: Assert action fails when PR author is not Dependabot and skip-verification is false
        env:
          OUTCOME: ${{ steps.action-no-skip.outcome }}
        run: |
          echo "outcome (skip-verification=false): $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when PR author is not Dependabot and skip-verification=false"
            exit 1
          fi
          echo "PASS: action correctly rejected non-Dependabot PR author"
