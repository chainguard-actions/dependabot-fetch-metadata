name: Test missing github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action checks for github-token first and fails with a specific message
      # if it is not set. We override the default by passing an empty string.
      # Note: the action's default is ${{ github.token }}, so we must explicitly
      # pass an empty value to trigger this code path.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ''

      - name: Assert action failed with missing token message
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when github-token is empty, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when github-token is not set"
