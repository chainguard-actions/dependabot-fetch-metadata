name: Test - Missing GitHub Token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a github-token. When an empty string is passed,
      # the action should fail immediately with a descriptive error message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ''

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when github-token is empty, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when github-token is missing"
