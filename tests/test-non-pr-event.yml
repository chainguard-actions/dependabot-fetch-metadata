name: Test non-PR event fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires a pull_request event payload. When triggered on a
      # push event (no pull_request key in payload), it should warn and return false,
      # causing the action to fail with "PR is not from Dependabot, nothing to do."
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          skip-verification: 'true'
        continue-on-error: true

      - name: Assert action failed due to missing pull_request payload
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when triggered outside a pull_request event, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no pull_request payload is present"
