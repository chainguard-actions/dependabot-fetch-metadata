name: Test compat-lookup input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compat-lookup: true
          skip-verification: true
        continue-on-error: true
      - name: Assert action ran with compat-lookup input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action may fail without a real Dependabot PR context,
          # but it must have been invoked (not skipped). Either success or
          # failure is acceptable — what matters is the input was passed.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with compat-lookup input (outcome=$OUTCOME)"
