name: Test compat-lookup input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: dependabot/npm_and_yarn/lodash-4.17.21
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          compat-lookup: 'true'
          skip-verification: 'true'
          github-token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran with compat-lookup
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "compatibility-score: ${{ steps.action.outputs.compatibility-score }}"
          echo "PASS: action completed with compat-lookup=true (skip-verification mode)"
