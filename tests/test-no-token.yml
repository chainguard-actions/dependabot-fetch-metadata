name: Test no github-token fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock PR event payload
        run: |
          mkdir -p /tmp/mock-event
          cat > /tmp/mock-event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 1,
              "user": { "login": "dependabot[bot]" },
              "head": { "ref": "dependabot/npm_and_yarn/lodash-4.17.21" },
              "base": { "ref": "main" },
              "body": "Bumps lodash from 4.17.20 to 4.17.21.",
              "title": "Bump lodash from 4.17.20 to 4.17.21"
            },
            "repository": {
              "name": "fetch-metadata",
              "owner": { "login": "dependabot" }
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_EVENT_PATH: /tmp/mock-event/event.json
          GITHUB_EVENT_NAME: pull_request
        with:
          github-token: ""
          skip-verification: "true"

      - name: Assert action failed due to missing token
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when github-token is empty, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when github-token is not set"
