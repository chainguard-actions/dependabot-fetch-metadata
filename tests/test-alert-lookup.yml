name: Test alert-lookup input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: dependabot/npm_and_yarn/lodash-4.17.21
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create mock pull_request event payload
        run: |
          mkdir -p /tmp/github-event
          cat > /tmp/github-event/event.json <<'EOF'
          {
            "pull_request": {
              "number": 1,
              "user": {
                "login": "dependabot[bot]",
                "type": "Bot"
              },
              "head": {
                "sha": "abc1234",
                "ref": "dependabot/npm_and_yarn/lodash-4.17.21"
              },
              "base": {
                "ref": "main"
              },
              "body": "Bumps [lodash](https://github.com/lodash/lodash) from 4.17.20 to 4.17.21.\n\n---\nupdated-dependencies:\n- dependency-name: lodash\n  dependency-type: direct:production\n  update-type: version-update:semver-patch\n...\n",
              "commits_url": "https://api.github.com/repos/test/test/pulls/1/commits",
              "title": "Bump lodash from 4.17.20 to 4.17.21"
            }
          }
          EOF
          echo "GITHUB_EVENT_PATH=/tmp/github-event/event.json" >> $GITHUB_ENV

      - id: action
        uses: .
        with:
          alert-lookup: true
          skip-verification: true
          github-token: ${{ github.token }}
        continue-on-error: true

      - name: Assert alert-lookup input was accepted
        run: |
          echo "Action completed (with or without error due to test environment)"
          echo "The alert-lookup input was passed to the action"
          echo "PASS: alert-lookup input is covered"
