name: Test alert-lookup input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: fake-token-for-testing
          alert-lookup: 'true'
        continue-on-error: true
      - name: Assert action handled alert-lookup input without crashing
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail gracefully because there is no pull_request event payload.
          # It should call setFailed (outcome=failure), not crash with an unhandled exception.
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action handled alert-lookup input without crashing (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
